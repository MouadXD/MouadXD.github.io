baseURL: "https://mouadboufas.me/"
languageCode: "en-us"
title: "Mouad Boufas | Offensive Security"
theme: "PaperMod"
enableRobotsTXT: true

services:
  googleAnalytics:
    ID: G-V3DMY9KLZY

params:
  env: production
  author: "Mouad Boufas"
  description: "Mouad Boufas is a cybersecurity master's student documenting penetration testing, web security research, and practical security projects."
  defaultTheme: dark
  disableThemeToggle: true
  ShowReadingTime: true
  ShowShareButtons: false
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowToc: true
  ShowRssButtonInSectionTermList: true
  ShowWordCount: false
  hideFooter: true

  assets:
    disableHLJS: false
    favicon: "/favicon.png"

  profileMode:
    enabled: false

  label:
    text: "m0ad"

homeInfoParams:
  Title: "Mouad Boufas"
  Content: >-
      Cybersecurity master's student focused on offensive security,
      web application penetration testing, and hands-on security research.

      I document practical labs, vulnerabilities, and projects as I learn.

  socialIcons:
    - name: github
      url: "https://github.com/MouadXD"
    - name: linkedin
      url: "https://www.linkedin.com/in/mouad-boufas/"

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 5
    - identifier: writeups
      name: Writeups
      url: /writeups/
      weight: 10
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 20
    - identifier: about
      name: About
      url: /about/
      weight: 30
    - identifier: pgp
      name: PGP
      title: PGP key
      url: /pgp-key.asc
      weight: 40
      params:
        target: "_blank"
